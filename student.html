<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Dashboard - D-TECH RES</title>
    <link rel="stylesheet" href="css/landing.css">
    <script src="js/utils/Toast.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <h1>Student Dashboard</h1>
            <div style="flex-grow: 1"></div>
            <button id="btn-logout" class="btn-text">Log Out</button>
        </header>

        <main>
            <h2 id="residence-name" style="margin-bottom: 24px; color: #0f172a;">🏠 Residence Loading...</h2>

            <div class="card" style="margin-bottom: 24px;">
                <h3>Current Alerts</h3>
                <ul class="alert-list" id="student-alerts" style="max-height: 200px; overflow-y: auto;">
                    <li class="alert-item green">Loading alerts...</li>
                </ul>
            </div>

            <div class="dashboard-grid">
                <div class="card">
                    <h3>2D Plan</h3>
                    <p>View the floor layout and appliance statuses.</p>
                    <button id="btn-view-2d" class="btn-primary" onclick="window.location.href='edit.html?readonly=true'" style="margin-top: auto;">View 2D Plan</button>
                </div>

                <div class="card">
                    <h3>3D Residence</h3>
                    <p>Explore an interactive 3D model of your residence.</p>
                    <button id="btn-view-3d" class="btn-primary" onclick="window.location.href='student-3d.html?readonly=true'" style="margin-top: auto; background-color: #8b5cf6;">View 3D Residence</button>
                </div>
            </div>
        </main>
    </div>

    <!-- We will inject firebase scripts later -->
    <script type="module" src="js/student-dashboard.js"></script>

</body>
</html>
