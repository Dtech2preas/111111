<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-TECH Residence Management System</title>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <div class="landing-container">
        <header class="landing-header">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <h1>D-TECH RES</h1>
        </header>

        <main class="landing-main">
            <div id="welcome-text">
                <h2>Welcome</h2>
                <p>Select your role to continue</p>
            </div>

            <div class="role-selection" id="role-selection">
                <button class="role-btn" data-role="student">
                    <h3>Student</h3>
                    <p>View alerts and floor plans</p>
                </button>
                <button class="role-btn" data-role="manager">
                    <h3>Residence Manager</h3>
                    <p>Manage residence and floor plans</p>
                </button>
            </div>

            <div class="auth-section hidden" id="auth-section">
                <button id="btn-back-roles" class="btn-text">← Back</button>
                <h3 id="auth-title">Log In</h3>
                <form id="auth-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <!-- Residence ID will be required for signup -->
                    <div class="form-group hidden" id="residence-group">
                        <label for="residence-id">Residence ID (e.g. RES001)</label>
                        <input type="text" id="residence-id">
                    </div>
                    <button type="submit" id="btn-auth-submit" class="btn-primary">Log In</button>
                </form>
                <p>
                    <a href="#" id="toggle-auth-mode">Need an account? Sign up</a>
                </p>
                <div id="auth-error" class="error-message"></div>
            </div>
        </main>
    </div>

    <!-- We will inject firebase scripts later -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
