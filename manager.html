<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manager Dashboard - D-TECH RES</title>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <h1>Manager Dashboard</h1>
            <div style="flex-grow: 1"></div>
            <button id="btn-logout" class="btn-text">Log Out</button>
        </header>

        <main>
            <h2 id="residence-name">My Residence</h2>

            <div class="dashboard-grid">
                <div class="card">
                    <h3>Floor Plans</h3>
                    <p>Manage floors, rooms, and appliances.</p>
                    <button id="btn-open-editor" class="btn-primary" onclick="window.location.href='editor.html'" style="margin-bottom: 10px;">Open Editor</button>
                    <button class="btn-primary" onclick="window.location.href='test3d.html'" style="margin-bottom: 10px; background-color: #6f42c1;">View 3D Residence</button>
                    <button id="btn-manage-appliances" class="btn-primary" onclick="window.location.href='appliance-status.html'" style="background: #17a2b8;">Manage Appliances</button>
                </div>

                <div class="card">
                    <h3>Issues / Alerts</h3>
                    <ul class="alert-list" id="manager-alerts">
                        <li class="alert-item green">Loading alerts...</li>
                    </ul>
                </div>

                <div class="card">
                    <h3>Students</h3>
                    <p>Manage student access</p>
                    <button id="btn-generate-qr" class="btn-primary" style="background: #6c757d">Generate QR Code</button>
                </div>
            </div>
        </main>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="modal-content card" style="background: white; padding: 20px; text-align: center; border-radius: 8px; max-width: 90%;">
            <h2>Student Join QR Code</h2>
            <p>Scan this code to join this residence</p>
            <div id="qr-code-container" style="margin: 20px auto; display: flex; justify-content: center; background: white; padding: 10px;"></div>
            <p id="qr-link-text" style="word-break: break-all; margin-bottom: 20px; color: #666; font-size: 14px;"></p>
            <button id="btn-close-qr" class="btn-primary">Close</button>
        </div>
    </div>

    <style>
        .modal.hidden { display: none !important; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="js/manager-dashboard.js"></script>
</body>
</html>
